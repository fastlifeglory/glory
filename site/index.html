<title>Fast Life Glory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style id="sheet">*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light dark;

  --ground:   #E9E6DF;
  --ground-2: #DFDBD1;
  --ink:      #1E1B16;
  --ink-2:    #6B6153;
  --ink-3:    #948B7C;
  --line:     #D2CCBF;
  --brass:    #8A5E12;
  --brass-2:  #B98A2A;
  --on-brass: #F6F3EC;

  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:    "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:   #17140F;
    --ground-2: #211D16;
    --ink:      #F3EDE1;
    --ink-2:    #A29785;
    --ink-3:    #766D5E;
    --line:     #2F2920;
    --brass:    #D9A441;
    --brass-2:  #E8BE68;
    --on-brass: #17140F;
  }
}

:root[data-theme="dark"] {
  --ground:   #17140F;
  --ground-2: #211D16;
  --ink:      #F3EDE1;
  --ink-2:    #A29785;
  --ink-3:    #766D5E;
  --line:     #2F2920;
  --brass:    #D9A441;
  --brass-2:  #E8BE68;
  --on-brass: #17140F;
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; }

::selection { background: var(--brass); color: var(--on-brass); }

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

/* ---- top bar ---- */

.bar {
  display: flex;
  justify-content: flex-end;
  min-height: 34px;
  margin-bottom: 18px;
}

/* ---- hero ---- */

.lights {
  display: flex;
  gap: 6px;
}

.lights i {
  display: block;
  width: 28px;
  height: 9px;
  background: var(--line);
  transform-origin: center;
  animation: lightOn .3s ease-out both;
}

.lights i:nth-child(1) { animation-delay: .12s; }
.lights i:nth-child(2) { animation-delay: .24s; }
.lights i:nth-child(3) { animation-delay: .36s; }
.lights i:nth-child(4) { animation-delay: .48s; }
.lights i:nth-child(5) { animation-delay: .60s; }

@keyframes lightOn {
  from { background: var(--line);  transform: scaleY(.5); }
  to   { background: var(--brass); transform: scaleY(1); }
}

@media (prefers-reduced-motion: reduce) {
  .lights i { animation: none; background: var(--brass); }
  .row, .row-go { transition: none !important; }
}

.eyebrow {
  margin: 22px 0 0;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--brass);
}

.name {
  margin: 6px 0 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(66px, 17vw, 128px);
  line-height: .84;
  letter-spacing: -.005em;
  text-wrap: balance;
}

.tagline {
  margin: 18px 0 0;
  max-width: 44ch;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-2);
  text-wrap: pretty;
}

/* ---- link board ---- */

.board {
  margin-top: 44px;
  border-top: 1px solid var(--line);
}

.row {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 17px 8px 17px 2px;
  border-bottom: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
  transition: background .18s ease, padding-left .18s ease;
}

a.row:hover { background: var(--ground-2); padding-left: 10px; }
a.row:hover .row-ch { color: var(--brass); }
a.row:hover .row-go { color: var(--brass); transform: translateX(4px); }

a.row:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: -2px;
  background: var(--ground-2);
}

.row-ch {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  transition: color .18s ease;
}

.row-title {
  font-size: 17px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.row-go {
  font-size: 16px;
  color: var(--ink-3);
  transition: color .18s ease, transform .18s ease;
}

.row--unset .row-title { color: var(--ink-3); font-weight: 400; }

.chip {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  border: 1px solid var(--line);
  padding: 3px 7px;
  white-space: nowrap;
}

/* ---- footer ---- */

.foot {
  margin-top: 26px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .1em;
  line-height: 1.9;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
}

.foot b { color: var(--brass); font-weight: 500; }

/* ---- controls ---- */

.btn {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-2);
  padding: 9px 13px;
  cursor: pointer;
  transition: border-color .16s ease, color .16s ease, background .16s ease;
}

.btn:hover { border-color: var(--brass); color: var(--brass); }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn[disabled] { opacity: .55; cursor: progress; }

.btn--go {
  background: var(--brass);
  border-color: var(--brass);
  color: var(--on-brass);
}

.btn--go:hover { background: var(--brass-2); border-color: var(--brass-2); color: var(--on-brass); }

.btn--quiet { border-color: transparent; padding: 9px 4px; }
.btn--quiet:hover { border-color: transparent; }

/* ---- editor ---- */

.editor { padding-top: 4px; }

.ed-head {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--brass);
  margin: 0 0 20px;
}

.ed-field { display: block; margin-bottom: 16px; }

.ed-label {
  display: block;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}

.inp {
  width: 100%;
  font-family: var(--f-body);
  font-size: 15px;
  color: var(--ink);
  background: var(--ground-2);
  border: 1px solid var(--line);
  padding: 9px 10px;
}

.inp:focus-visible { outline: 2px solid var(--brass); outline-offset: -1px; }

.ed-links {
  margin: 26px 0 0;
  border-top: 1px solid var(--line);
}

.ed-row {
  display: grid;
  grid-template-columns: 110px 1fr 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.ed-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
}

.ed-msg {
  flex: 1;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.ed-msg[data-tone="bad"] { color: var(--brass); }

@media (max-width: 560px) {
  .ed-row { grid-template-columns: 1fr auto; }
  .ed-row .inp:first-child { grid-column: 1 / -1; }
}

@media (max-width: 480px) {
  .wrap { padding: 32px 18px 56px; }
  .row { grid-template-columns: 1fr auto; row-gap: 3px; }
  .row-ch { grid-column: 1 / -1; }
  .lights i { width: 22px; }
}
</style>
<div id="app"><div class="wrap"><div class="bar"><button class="btn" id="editBtn" hidden>Edit page</button></div><header class="hero"><div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p class="eyebrow">Fast Life</p><h1 class="name">GLORY</h1><p class="tagline">Everything I&#39;m building and putting out, collected on one page.</p></header><nav class="board" aria-label="Links"><a class="row" href="https://github.com/fastlifeglory" target="_blank" rel="noopener noreferrer"><span class="row-ch">GitHub</span><span class="row-title">fastlifeglory</span><span class="row-go" aria-hidden="true">&rarr;</span></a><div class="row row--unset"><span class="row-ch">Instagram</span><span class="row-title">&mdash;</span><span class="chip">Not set</span></div><div class="row row--unset"><span class="row-ch">YouTube</span><span class="row-title">&mdash;</span><span class="chip">Not set</span></div><div class="row row--unset"><span class="row-ch">Contact</span><span class="row-title">&mdash;</span><span class="chip">Not set</span></div></nav><p class="foot">Last updated <b>2026-09-04</b> &middot; 1 link live<br>3 slots still empty</p></div></div>
<script type="application/json" id="state">{"eyebrow":"Fast Life","name":"GLORY","tagline":"Everything I'm building and putting out, collected on one page.","updated":"2026-09-04","links":[{"channel":"GitHub","title":"fastlifeglory","url":"https://github.com/fastlifeglory"},{"channel":"Instagram","title":"","url":""},{"channel":"YouTube","title":"","url":""},{"channel":"Contact","title":"","url":""}]}</script>
<script id="boot">(function () {
  'use strict';

  /* ------------------------------------------------------------------
     Pure rendering. Shared by the build step (Node) and the live page,
     so the served markup and any version the page republishes are
     produced by exactly the same code.
  ------------------------------------------------------------------ */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeUrl(u) {
    var v = String(u == null ? '' : u).trim();
    if (!v || v === '#') return '';
    return /^(https?:\/\/|mailto:)/i.test(v) ? v : '';
  }

  function normalizeUrl(u) {
    var v = String(u == null ? '' : u).trim();
    if (!v || v === '#') return '';
    if (/^(https?:\/\/|mailto:)/i.test(v)) return v;
    if (v.indexOf('@') > 0 && v.indexOf('/') === -1 && v.indexOf(' ') === -1) return 'mailto:' + v;
    return 'https://' + v.replace(/^\/+/, '');
  }

  function renderRow(link) {
    var url = safeUrl(link.url);
    var channel = esc(link.channel || 'Link');
    var title = esc(link.title || '');

    if (!url) {
      return '<div class="row row--unset">' +
        '<span class="row-ch">' + channel + '</span>' +
        '<span class="row-title">' + (title || '&mdash;') + '</span>' +
        '<span class="chip">Not set</span>' +
        '</div>';
    }

    return '<a class="row" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="row-ch">' + channel + '</span>' +
      '<span class="row-title">' + (title || esc(url)) + '</span>' +
      '<span class="row-go" aria-hidden="true">&rarr;</span>' +
      '</a>';
  }

  function renderApp(state) {
    var links = Array.isArray(state.links) ? state.links : [];
    var live = links.filter(function (l) { return !!safeUrl(l.url); }).length;
    var blank = links.length - live;

    var lights = '';
    for (var i = 0; i < 5; i++) lights += '<i></i>';

    var rows = links.map(renderRow).join('');

    var foot = 'Last updated <b>' + esc(state.updated || '') + '</b> &middot; ' +
      live + (live === 1 ? ' link live' : ' links live');
    if (blank > 0) {
      foot += '<br>' + blank + (blank === 1 ? ' slot still empty' : ' slots still empty');
    }

    return '<div class="wrap">' +
      '<div class="bar"><button class="btn" id="editBtn" hidden>Edit page</button></div>' +
      '<header class="hero">' +
        '<div class="lights" aria-hidden="true">' + lights + '</div>' +
        '<p class="eyebrow">' + esc(state.eyebrow || '') + '</p>' +
        '<h1 class="name">' + esc(state.name || '') + '</h1>' +
        '<p class="tagline">' + esc(state.tagline || '') + '</p>' +
      '</header>' +
      '<nav class="board" aria-label="Links">' + rows + '</nav>' +
      '<p class="foot">' + foot + '</p>' +
      '</div>';
  }

  /* Build step stops here. */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { renderApp: renderApp, normalizeUrl: normalizeUrl };
    return;
  }

  /* ------------------------------------------------------------------
     Live page
  ------------------------------------------------------------------ */

  var CLOSE = '<' + '/script>';
  var app = document.getElementById('app');
  var state = JSON.parse(document.getElementById('state').textContent);
  var api = null;
  var writable = false;
  var editing = false;

  function field(key, label, value) {
    return '<label class="ed-field">' +
      '<span class="ed-label">' + esc(label) + '</span>' +
      '<input class="inp" id="f-' + key + '" value="' + esc(value || '') + '">' +
      '</label>';
  }

  function editRow(link, i) {
    return '<div class="ed-row" data-i="' + i + '">' +
      '<input class="inp" data-k="channel" aria-label="Channel" placeholder="Channel" value="' + esc(link.channel || '') + '">' +
      '<input class="inp" data-k="title" aria-label="Label" placeholder="Label" value="' + esc(link.title || '') + '">' +
      '<input class="inp" data-k="url" aria-label="Address" placeholder="https://" value="' + esc(link.url || '') + '">' +
      '<button class="btn btn--quiet" data-del="' + i + '" aria-label="Remove this link">&times;</button>' +
      '</div>';
  }

  function renderEditor(s) {
    var links = Array.isArray(s.links) ? s.links : [];
    return '<div class="wrap"><div class="editor">' +
      '<p class="ed-head">Editing &mdash; nothing changes for anyone until you publish</p>' +
      field('eyebrow', 'Eyebrow', s.eyebrow) +
      field('name', 'Name', s.name) +
      field('tagline', 'Tagline', s.tagline) +
      '<div class="ed-links" id="edLinks">' + links.map(editRow).join('') + '</div>' +
      '<div class="ed-actions">' +
        '<span class="ed-msg" id="edMsg"></span>' +
        '<button class="btn" id="edAdd">Add link</button>' +
        '<button class="btn" id="edCancel">Cancel</button>' +
        '<button class="btn btn--go" id="edSave">Publish</button>' +
      '</div>' +
      '</div></div>';
  }

  function paint() {
    app.innerHTML = editing ? renderEditor(state) : renderApp(state);
    var btn = document.getElementById('editBtn');
    if (btn) btn.hidden = !writable;
  }

  function value(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function collect() {
    var next = {
      eyebrow: value('f-eyebrow'),
      name: value('f-name'),
      tagline: value('f-tagline'),
      updated: state.updated,
      links: []
    };
    var rows = document.querySelectorAll('#edLinks .ed-row');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var read = function (k) {
        var el = row.querySelector('[data-k="' + k + '"]');
        return el ? el.value.trim() : '';
      };
      next.links.push({
        channel: read('channel'),
        title: read('title'),
        url: normalizeUrl(read('url'))
      });
    }
    return next;
  }

  function message(text, tone) {
    var el = document.getElementById('edMsg');
    if (!el) return;
    el.textContent = text;
    if (tone) el.setAttribute('data-tone', tone);
    else el.removeAttribute('data-tone');
  }

  function buildDoc(s) {
    var css = document.getElementById('sheet').textContent;
    var boot = document.getElementById('boot').textContent;
    var fonts = document.getElementById('fonts').getAttribute('href');
    var json = JSON.stringify(s).replace(/</g, '\\u003c');

    return '<!doctype html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Fast Life Glory</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link id="fonts" rel="stylesheet" href="' + esc(fonts) + '">\n' +
      '<style id="sheet">' + css + '</style>\n' +
      '</head>\n<body>\n' +
      '<div id="app">' + renderApp(s) + '</div>\n' +
      '<script type="application/json" id="state">' + json + CLOSE + '\n' +
      '<script id="boot">' + boot + CLOSE + '\n' +
      '</body>\n</html>\n';
  }

  function readOnly() {
    writable = false;
    editing = false;
    paint();
  }

  function publish(button) {
    var next = collect();
    next.updated = new Date().toISOString().slice(0, 10);
    state = next;

    if (!api) {
      message('This view cannot publish changes.', 'bad');
      return;
    }

    button.disabled = true;
    message('Publishing...');

    api.publish(buildDoc(next)).then(function () {
      message('Published. Reloading...');
    }).catch(function (err) {
      var code = err && err.code;
      button.disabled = false;

      if (code === 'conflict') {
        message('A newer version arrived first. Reloading to it.');
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' ||
          code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed') {
        readOnly();
        return;
      }
      if (code === 'rate_limited') {
        message('Publishing too fast. Wait a moment, then publish again.', 'bad');
        return;
      }
      if (code === 'too_large') {
        message('There is too much content to publish. Shorten it and retry.', 'bad');
        return;
      }
      message('Publishing failed. Your edits are still here - try again.', 'bad');
    });
  }

  app.addEventListener('click', function (event) {
    var button = event.target.closest ? event.target.closest('button') : null;
    if (!button) return;

    if (button.id === 'editBtn') { editing = true; paint(); return; }
    if (button.id === 'edCancel') { editing = false; paint(); return; }
    if (button.id === 'edAdd') {
      state = collect();
      state.links.push({ channel: 'Link', title: '', url: '' });
      paint();
      return;
    }
    if (button.hasAttribute('data-del')) {
      state = collect();
      state.links.splice(Number(button.getAttribute('data-del')), 1);
      paint();
      return;
    }
    if (button.id === 'edSave') { publish(button); }
  });

  if (window.claude && typeof window.claude.use === 'function') {
    Promise.resolve(window.claude.use('artifact')).then(function (ns) {
      api = ns || null;
      writable = !!ns;
      var btn = document.getElementById('editBtn');
      if (btn) btn.hidden = !writable;
    }).catch(function () { /* stays read-only */ });
  }
})();
</script>
